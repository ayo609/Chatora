<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#04080c" />
<title>Chatora</title>
<link rel="icon" type="image/png" href="chatora-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#04080c;--teal:#0F766E;--em:#10B981;--cy:#22D3EE;--tx:#e6edf3;--mu:#8392a0;--ln:rgba(255,255,255,.08);--bad:#fb7185;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit;font-size:16px;outline:0;border:0;background:none}
select option{background:#0d161d}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:8px}
.hide{display:none!important}
#app{position:fixed;left:0;right:0;top:0;height:var(--vh,100dvh);display:grid;grid-template-columns:100%;overflow:hidden;
 background:radial-gradient(circle at 12% 0,rgba(15,118,110,.25),transparent 45%),radial-gradient(circle at 95% 100%,rgba(34,211,238,.12),transparent 45%),var(--bg)}

/* sidebar */
.side{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--ln)}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--st)) calc(16px + var(--sr)) 10px calc(16px + var(--sl));background:rgba(8,15,21,.78);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--ln);z-index:4}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:var(--em)}
.brand img{width:30px;height:30px;object-fit:contain}
.tabs{flex:1;min-height:0;position:relative}
.tab{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.tab.on{display:flex;animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:140px}
.pills{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.pills::-webkit-scrollbar{display:none}
.pill{padding:7px 15px;border-radius:999px;font-size:13px;font-weight:500;background:rgba(34,211,238,.08);color:#7dd3fc;white-space:nowrap;border:1px solid transparent;transition:all .25s}
.pill.on{background:rgba(16,185,129,.2);color:var(--em);border-color:rgba(16,185,129,.45)}.pill:active{transform:scale(.93)}
.pill i{font-style:normal;background:var(--em);color:#04130d;border-radius:9px;padding:1px 6px;font-size:11px;margin-left:4px;font-weight:700}
.srch{display:flex;align-items:center;gap:10px;margin:8px 16px;padding:0 14px;height:42px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--ln);color:var(--mu);flex-shrink:0}
.srch input{flex:1;min-width:0;height:100%}
.item{display:flex;gap:13px;padding:11px 16px;cursor:pointer;transition:background .2s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.item:hover{background:rgba(34,211,238,.05)}.item:active{background:rgba(34,211,238,.1)}.item.on{background:rgba(34,211,238,.1)}
.im{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.l1,.l2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.l1 b{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1 time{font-size:11.5px;color:var(--mu);flex-shrink:0}.l1 time.u{color:var(--em)}
.l2 span{font-size:13.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.l2 span.ty{color:var(--em)}
.bdg{font-style:normal;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--em);color:#04130d;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.star{color:#fbbf24;font-size:13px;font-style:normal}
.av{border-radius:50%;object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;background:linear-gradient(135deg,#0F766E,#10B981)}
.av.ai{background:linear-gradient(135deg,#22D3EE,#0F766E)}.av.grp{background:linear-gradient(135deg,#0e7490,#0F766E)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + var(--sb));background:rgba(8,15,21,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--ln);z-index:5}
.ni{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mu);font-size:11px;font-weight:500;transition:color .25s}
.ni.on{color:var(--em)}.ni svg{transition:transform .3s}.ni.on svg{transform:translateY(-2px) scale(1.1)}
.nb{position:absolute;top:1px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.fab{position:absolute;right:calc(18px + var(--sr));bottom:calc(78px + var(--sb));width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;z-index:6;background:linear-gradient(135deg,#0F766E,#10B981);box-shadow:0 14px 30px -10px rgba(16,185,129,.7);transition:transform .25s}
.fab:active{transform:scale(.9)}
.fab.ai{bottom:calc(144px + var(--sb));width:46px;height:46px;font-size:20px;background:linear-gradient(135deg,#22D3EE,#0F766E);animation:flt 3s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-6px)}}
.empt{display:flex;flex-direction:column;align-items:center;gap:10px;padding:50px 30px;text-align:center;color:var(--mu);font-size:14px;line-height:1.5}
.empt .e{font-size:44px}.empt b{color:var(--tx);font-size:16px}
.sec{padding:16px 16px 6px;font-size:12px;font-weight:600;color:var(--em);letter-spacing:.04em;text-transform:uppercase}

/* pane + chat */
.pane{position:absolute;inset:0;z-index:20;background:var(--bg);transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#app.open .pane{transform:none}
.empty{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--mu);text-align:center;padding:30px}
.chat{display:none;flex:1;min-height:0;flex-direction:column;position:relative}.pane.has .chat{display:flex}
@media(min-width:900px){#app{grid-template-columns:clamp(340px,34vw,430px) 1fr}.pane{position:relative;transform:none;z-index:1}.empty{display:flex}.pane.has .empty{display:none}#back{display:none}}
.chead{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--st)) calc(12px + var(--sr)) 10px calc(6px + var(--sl));background:rgba(8,15,21,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--ln);z-index:3}
@media(min-width:900px){.chead{padding-left:16px}}
.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--cy);flex-shrink:0;transition:background .2s,transform .2s}
.ib:hover{background:rgba(255,255,255,.07)}.ib:active{transform:scale(.88)}
.hm{flex:1;min-width:0;cursor:pointer}.hm b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm small{display:block;font-size:12px;color:var(--em);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px calc(12px + var(--sr)) 8px calc(12px + var(--sl));display:flex;flex-direction:column;gap:3px;
 background-image:radial-gradient(rgba(34,211,238,.05) 1px,transparent 1px);background-size:22px 22px}
.day{align-self:center;margin:10px 0 6px}.day span{font-size:11.5px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--mu)}
.row{display:flex;gap:8px;max-width:100%;animation:pop .25s}.row.out{justify-content:flex-end}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.rav{align-self:flex-end}
.bw{max-width:82%;display:flex;flex-direction:column;min-width:0}.row.out .bw{align-items:flex-end}
.bub{padding:8px 12px 6px;border-radius:17px;font-size:15px;line-height:1.42;position:relative;overflow-wrap:anywhere;user-select:text;-webkit-touch-callout:none}
.out .bub{background:linear-gradient(135deg,#0F766E,#0c8f66);border-bottom-right-radius:5px}
.in .bub{background:#17222b;border-bottom-left-radius:5px}
.bub.aiB{background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.25);border-bottom-left-radius:5px}
.bub a{color:#7dd3fc}.bub.pic{padding:4px}.bub.pic .meta{padding:0 6px 2px}
.sn{font-size:12px;font-weight:600;color:var(--cy);margin-bottom:2px}
.meta{display:flex;gap:4px;justify-content:flex-end;align-items:center;font-size:10.5px;opacity:.72;margin-top:2px}
.tk.r{color:#67e8f9;opacity:1}
.del{opacity:.7;font-size:13.5px}
.rq{margin:-2px 0 6px;padding:6px 10px;border-radius:10px;border-left:3px solid var(--cy);background:rgba(0,0,0,.22);font-size:12.5px;cursor:pointer;display:flex;flex-direction:column}
.rq b{color:var(--cy);font-weight:600}.rq span{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.imgm{display:block;max-width:100%;width:260px;max-height:340px;object-fit:cover;border-radius:13px;cursor:zoom-in}
.cap{padding:6px 8px 0;font-size:14.5px}
.trn{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.25);font-size:14px;opacity:.95}
.rxs{display:flex;gap:4px;margin-top:-6px;padding:0 6px;position:relative;z-index:1}
.rx{font-size:12.5px;padding:2px 7px;border-radius:12px;background:#22303a;border:1px solid rgba(255,255,255,.12)}.rx.me{border-color:var(--em);background:rgba(16,185,129,.2)}
.flash{animation:fl 1.2s}@keyframes fl{0%,60%{background:rgba(34,211,238,.18)}}
.typ{display:flex;gap:4px;padding:6px 2px}.typ i{width:7px;height:7px;border-radius:50%;background:#7b8894;animation:ty 1s infinite}.typ i:nth-child(2){animation-delay:.15s}.typ i:nth-child(3){animation-delay:.3s}
@keyframes ty{50%{transform:translateY(-4px);opacity:.4}}
.vp{display:flex;align-items:center;gap:10px;min-width:214px}
.pp{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .2s}.pp:active{transform:scale(.88)}
.wv{flex:1;display:flex;align-items:center;gap:2px;height:30px}.wv i{flex:1;min-width:2px;border-radius:2px;background:rgba(255,255,255,.35);transition:background .15s}.wv i.on{background:#fff}
.in .wv i.on{background:var(--cy)}
.vd{font-size:11.5px;opacity:.85;min-width:32px;text-align:right}
.rbar{display:flex;align-items:center;gap:10px;padding:8px calc(14px + var(--sr)) 8px calc(14px + var(--sl));background:rgba(8,15,21,.95);border-top:1px solid var(--ln)}
.rbar div{flex:1;min-width:0;border-left:3px solid var(--cy);padding-left:10px;font-size:13px}.rbar b{color:var(--cy);display:block}.rbar span{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px calc(10px + var(--sr)) 8px calc(10px + var(--sl));background:rgba(8,15,21,.97);border-top:1px solid var(--ln);max-height:190px;overflow-y:auto}
.emo button{font-size:24px;padding:6px 0;border-radius:10px}.emo button:active{background:rgba(255,255,255,.1)}

/* Input Area fixed for mobile */
.comp,.rec{display:flex;align-items:flex-end;gap:6px;padding:8px calc(10px + var(--sr)) calc(8px + var(--sb)) calc(10px + var(--sl));background:rgba(8,15,21,.94);border-top:1px solid var(--ln);width:100%;box-sizing:border-box}
.cbox{flex:1;min-width:0;display:flex;align-items:flex-end;background:rgba(255,255,255,.07);border-radius:23px;padding:2px 4px;border:1px solid transparent;transition:border-color .2s;overflow:hidden}
.cbox:focus-within{border-color:rgba(34,211,238,.4)}
.cbox textarea{flex:1;min-width:0;resize:none;max-height:120px;padding:9px 6px;line-height:1.35;font-size:15px;width:100%}
.cb2{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--cy);flex-shrink:0}.cb2:active{background:rgba(255,255,255,.1)}
.sendb{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#0F766E,#10B981);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 20px -8px rgba(16,185,129,.8);transition:transform .2s}.sendb:active{transform:scale(.86)}
.blk{padding:14px;text-align:center;font-size:13.5px;color:var(--mu)}
.rec{align-items:center;gap:10px}
.rdot{width:11px;height:11px;border-radius:50%;background:#ef4444;animation:bl 1s infinite;flex-shrink:0}@keyframes bl{50%{opacity:.25}}
.rtime{font-variant-numeric:tabular-nums;font-weight:500;min-width:38px}
.rwave{flex:1;height:38px;display:flex;align-items:center;gap:2px;overflow:hidden;justify-content:flex-end}
.rwave i{flex:1;min-width:2px;max-width:4px;border-radius:2px;background:linear-gradient(#22D3EE,#10B981);height:8%;transition:height .07s}
.rtrash{color:#fca5a5}

/* info */
.info{position:absolute;inset:0;z-index:10;background:var(--bg);transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}.info.on{transform:none}
.iscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(24px + var(--sb))}
.ihero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 20px 18px;text-align:center}
.ihero h2{font-size:22px}.ihero small{color:var(--mu);font-size:13.5px}
.btnrow{display:flex;gap:10px;padding:6px 20px 16px}.btnrow button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:rgba(255,255,255,.06);font-size:12.5px;color:var(--cy)}.btnrow button:active{transform:scale(.94)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 16px}.mgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--ln);font-size:15px}.lrow.dg{color:var(--bad)}.lrow>span{flex:1}.lrow small{color:var(--mu)}

/* me / forms / modals */
.card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.06);text-align:left;margin:12px 0}.card b{display:block}.card small{color:var(--mu)}
.fi{width:100%;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--ln);transition:border-color .2s}.fi:focus{border-color:var(--cy)}
.fi2{display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--ln);margin:10px 0}.fi2 input{flex:1;padding:12px 0}.fi2 span{color:var(--mu)}
.lbl{display:block;font-size:12.5px;color:var(--mu);margin:14px 0 6px;text-align:left}
.b1,.b2{padding:12px 18px;border-radius:13px;font-weight:600;font-size:14.5px;transition:transform .2s,opacity .2s}
.b1{background:linear-gradient(135deg,#0F766E,#10B981);color:#fff;box-shadow:0 10px 22px -10px rgba(16,185,129,.8)}.b1.dg{background:linear-gradient(135deg,#be123c,#e11d48)}
.b2{background:rgba(255,255,255,.08)}.b1:active,.b2:active{transform:scale(.95)}.b1:disabled{opacity:.5}.wide{width:100%;margin-top:6px}
.two{display:flex;gap:10px;margin-top:8px}.two>*{flex:1}
.ov{position:fixed;inset:0;z-index:200;background:rgba(2,6,10,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .25s}
.ov.on{opacity:1}.ov.shd{align-items:flex-end;padding:0}
.mdl{width:100%;max-width:380px;max-height:86dvh;overflow:auto;padding:24px;border-radius:24px;background:linear-gradient(145deg,rgba(26,40,50,.97),rgba(10,18,24,.99));border:1px solid var(--ln);box-shadow:0 40px 80px -20px rgba(0,0,0,.9);transform:translateY(14px) scale(.96);transition:transform .35s cubic-bezier(.2,1.1,.3,1);text-align:center}
.ov.on .mdl{transform:none}
.mdl h3{font-size:19px;margin:8px 0 6px}.mdl p,.sub{color:var(--mu);font-size:14px;line-height:1.5}.mi{font-size:38px}.mb{display:flex;gap:10px;margin-top:20px}.mb>*{flex:1}
.mdl.sheet{max-width:540px;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + var(--sb));text-align:left;transform:translateY(100%)}.ov.on .mdl.sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:0 auto 12px}.sh{font-size:17px;margin-bottom:6px}
.acts{display:flex;flex-direction:column}.act{display:flex;align-items:center;gap:14px;padding:14px 6px;font-size:15.5px;text-align:left;border-top:1px solid var(--ln)}.act:first-child{border-top:0}.act span{width:24px;display:flex;justify-content:center;color:var(--cy)}.act.dg,.act.dg span{color:var(--bad)}.act:active{background:rgba(255,255,255,.05)}
.rxbar{display:flex;justify-content:space-between;padding:6px 4px 12px}.rxbar button{font-size:28px;padding:4px 8px;border-radius:14px;transition:transform .15s}.rxbar button:active{transform:scale(1.35)}
.pv{width:100%;max-height:44dvh;object-fit:contain;border-radius:14px;margin:10px 0}
.chk{display:flex;align-items:center;gap:12px;padding:9px 4px;text-align:left}.chk input{width:20px;height:20px;accent-color:#10B981}.chk b{font-weight:500}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.colors button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.colors button.on{border-color:#fff}
.me-av{position:relative;width:110px;height:110px;margin:0 auto}.me-av .cam{position:absolute;right:-2px;bottom:2px;width:36px;height:36px;border-radius:50%;background:#fff;color:#0F766E;display:flex;align-items:center;justify-content:center}
.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--em),var(--cy),var(--em));flex-shrink:0;position:relative}.ring.seen{background:#3b4752}.ring.none{background:transparent}.ring .av{border:3px solid var(--bg)}
.plus{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--em);color:#04130d;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid var(--bg)}
.toasts{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(400px,calc(100% - 24px));z-index:400;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{pointer-events:auto;position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:12px;padding:12px 14px 14px;border-radius:16px;background:rgba(8,16,22,.9);border:1px solid var(--ln);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 20px 40px -16px rgba(0,0,0,.9);animation:tin .5s cubic-bezier(.2,1.2,.3,1) both}
.toast.out{animation:tout .35s ease forwards}@keyframes tin{from{opacity:0;transform:translateY(-26px) scale(.95)}}@keyframes tout{to{opacity:0;transform:translateY(-16px) scale(.96)}}
.toast .ti{width:28px;height:28px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#04130d;background:var(--c)}
.toast b{display:block;font-size:13.5px;font-weight:600}.toast .m{display:block;font-size:12.5px;color:#aab7c4;line-height:1.45;margin-top:2px;word-break:break-word}

let audioCtx;
function playPing() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
    osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } catch(e) {}
}

function listTime(t){if(!t)return'';const d=new Date(ms(t));return same(d,new Date())?hm(t):same(d,new Date(Date.now()-864e5))?'Yesterday':d.toLocaleDateString([],{month:'short',day:'numeric'})}

/* photos */
function loadImg(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'))};i.src=u})}
async function prep(f,{max=900,sq=0,q=.8,limit:lim=300000}={}){if(!f||!f.type.startsWith('image/'))throw new Error('type');const im=await loadImg(f),w=im.naturalWidth,h=im.naturalHeight;let cw,ch,sx=0,sy=0,sw=w,sh=h;
  if(sq){const s=Math.min(w,h);sx=(w-s)/2;sy=(h-s)/2;sw=sh=s;cw=ch=Math.min(sq,s)}else{const k=Math.min(1,max/Math.max(w,h));cw=Math.round(w*k);ch=Math.round(h*k)}
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');x.fillStyle='#0b1a20';x.fillRect(0,0,cw,ch);x.imageSmoothingQuality='high';x.drawImage(im,sx,sy,sw,sh,0,0,cw,ch);
  let d=c.toDataURL('image/jpeg',q);while(d.length>lim&&q>.35){q-=.1;d=c.toDataURL('image/jpeg',q)}return d}
function pickImage(cb){const f=$('#file');f.value='';f.onchange=async()=>{const file=f.files[0];if(!file)return;try{cb(file)}catch(e){toast('error','Couldn’t read that photo','Try a JPG or PNG.')}};f.click()}
$('#bImg').onclick=()=>pickImage(async file=>{if(file.size>20*1024*1024)return toast('error','Photo too large','Choose a photo under 20 MB.');
  let d;try{d=await prep(file,{max:1000,q:.75,limit:380000})}catch(e){return toast('error','Couldn’t read that photo','Try a JPG or PNG.')}
  const m=modal(`<div class="grab"></div><h3 class="sh">Send photo</h3><img class="pv" src="${d}" alt="Preview"><div class="fi2"><input id="pc" maxlength="300" placeholder="Add a caption (optional)"></div><div class="two"><button class="b2" data-v="0">Cancel</button><button class="b1" data-v="1">Send</button></div>`,true);
  m.box.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;m.close();if(b.dataset.v==='1'){const cap=m.box.querySelector('#pc').value.trim();if(S.cur.type==='ai')return toast('info','Photos aren’t supported in AI chat yet');sendMsg({type:'image',image:d,text:cap});toast('success','Photo sent','',1800)}})});

/* ================= voice notes: record ================= */
const R={on:false, paused:false, t0:0, elapsed:0};
async function recStart(){if(R.on||R.starting||!S.cur)return;if(S.cur.type==='ai')return toast('info','Voice notes aren’t available in AI chat','Open a chat with a friend to send a voice note.');
  if(!navigator.mediaDevices||!window.MediaRecorder)return toast('error','Recording not supported','Use a recent Chrome, Safari or Firefox over HTTPS.');
  R.starting=true;let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){R.starting=false;return toast('error','Microphone blocked','Allow microphone access for this site in your browser settings.')}
  R.starting=false;const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  let mr;try{mr=new MediaRecorder(stream,{...(mime?{mimeType:mime}:{}),audioBitsPerSecond:32000})}catch(e){stream.getTracks().forEach(t=>t.stop());return toast('error','Recording failed','This browser couldn’t start the recorder.')}
  Object.assign(R,{on:true,paused:false,stream,mr,chunks:[],peaks:[],t0:Date.now(),elapsed:0,mime:mr.mimeType||mime,send:false});
  mr.ondataavailable=e=>{if(e.data&&e.data.size)R.chunks.push(e.data)};
  try{const AC=window.AudioContext||window.webkitAudioContext;R.ctx=new AC();R.an=R.ctx.createAnalyser();R.an.fftSize=256;R.ctx.createMediaStreamSource(stream).connect(R.an);R.buf=new Uint8Array(R.an.fftSize);if(R.ctx.state==='suspended')R.ctx.resume()}catch(e){R.an=null}
  const w=$('#rWave');w.innerHTML=Array(44).fill('<i></i>').join('');R.bars=[...w.children];R.lv=Array(44).fill(.05);
  $('#comp').classList.add('hide');$('#emo').classList.add('hide');$('#rec').classList.remove('hide');
  $('#rPause').innerHTML = IC.pause;
  mr.start(250);navigator.vibrate&&navigator.vibrate(15);
  R.iv=setInterval(()=>{
    if(R.paused) return;
    let l=.06;if(R.an){R.an.getByteTimeDomainData(R.buf);let mx=0;for(const v of R.buf)mx=Math.max(mx,Math.abs(v-128));l=Math.min(1,mx/70)}
    R.peaks.push(l);R.lv.push(l);R.lv.shift();R.bars.forEach((b,i)=>b.style.height=Math.max(8,R.lv[i]*100)+'%');
    R.elapsed += 0.07;
    $('#rTime').textContent=dur(R.elapsed);
    if(R.elapsed>=110){toast('info','Maximum length reached','Sending your voice note.',2500);recStop(true)}
  },70);
  
  $('#rPause').onclick = () => {
    if(!R.on) return;
    R.paused = !R.paused;
    if(R.paused) {
      R.mr.pause();
      $('#rPause').innerHTML = IC.play;
    } else {
      R.mr.resume();
      $('#rPause').innerHTML = IC.pause;
    }
  };
}

function recCleanup(){clearInterval(R.iv);try{R.stream.getTracks().forEach(t=>t.stop())}catch(e){}try{R.ctx&&R.ctx.close()}catch(e){}R.on=false;$('#rec').classList.add('hide');if($('#blk').classList.contains('hide'))$('#comp').classList.remove('hide')}
function recCancel(silent){if(!R.on)return;R.mr.onstop=null;try{R.mr.stop()}catch(e){}recCleanup();if(!silent)toast('info','Recording discarded','',1800)}
function recStop(send){if(!R.on)return;const mr=R.mr,t0=R.t0,peaks=R.peaks,mime=R.mime;
  mr.onstop=async()=>{const chunks=R.chunks,d=R.elapsed;recCleanup();if(!send)return;
    if(d<.8)return toast('warn','Too short','Hold on a little longer to record.',2500);
    const blob=new Blob(chunks,{type:mime||'audio/webm'});const url=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});
    if(url.length>900000)return toast('error','Voice note too long','Keep it under about 90 seconds.');
    const n=40,wave=[];for(let i=0;i<n;i++){const s=Math.floor(i*peaks.length/n),e=Math.max(s+1,Math.floor((i+1)*peaks.length/n));let m=0;for(let j=s;j<e&&j<peaks.length;j++)m=Math.max(m,peaks[j]);wave.push(Math.round(m*100))}
    await sendMsg({type:'voice',audio:url,dur:Math.round(d),wave});toast('success','Voice note sent','',1800)};
  try{mr.stop()}catch(e){recCleanup()}}
$('#rCancel').onclick=()=>recCancel();$('#rSend').onclick=()=>recStop(true);

const Pl={a:null,id:null};
function stopPlay(){if(Pl.a){Pl.a.pause();Pl.a=null}Pl.id=null;playUI()}
function togglePlay(id){const m=S.byId[id];if(!m||!m.audio)return;if(Pl.id===id&&Pl.a){if(Pl.a.paused)Pl.a.play().catch(()=>{});else Pl.a.pause();playUI();return}

  a.onplay=playUI;a.onpause=playUI;a.ontimeupdate=()=>playUI();a.onended=()=>{Pl.id=null;Pl.a=null;playUI()};
  a.onerror=()=>{stopPlay();toast('error','Can’t play this voice note','Your device may not support this audio format.')};a.play().catch(()=>{stopPlay();toast('error','Can’t play this voice note','Tap the play button again.')})}

let warmT=0;function warm(){if(Date.now()-warmT<240000)return;warmT=Date.now();fetch(AI_URL+'/',{mode:'no-cors'}).catch(()=>{})}

async function askAI(messages){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),60000);
  try{const r=await fetch(AI_URL+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages}),signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json(),x=d.reply??d.message??d.text??d.response??(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content);if(!x)throw new Error('empty reply');return String(x).trim()}finally{clearTimeout(t)}}
function sendAI(text){const hist=[...S.msgs.filter(m=>m.text).slice(-13).map(m=>({role:m.senderId==='AI'?'assistant':'user',content:m.text})),{role:'user',content:text}];
  addDoc(collection(db,'users',uid,'ai'),{role:'user',text,createdAt:serverTimestamp()}).catch(e=>{rulesErr(e,'AI chat');toast('error','Message not saved','Check your connection.')});runAI(hist)}
async function runAI(hist){S.aiBusy=true;S.aiFail=null;renderHead();paint();let reply=null;
  for(let i=0;i<3&&!reply;i++){try{reply=await askAI(hist)}catch(e){console.warn('AI attempt',i+1,e);if(i<2)await sleep(i?4000:1500)}}
  S.aiBusy=false;renderHead();
  if(reply){S.forceBottom=true;addDoc(collection(db,'users',uid,'ai'),{role:'assistant',text:reply,createdAt:serverTimestamp()}).catch(e=>{rulesErr(e,'AI chat');toast('error','Reply not saved','Check your connection.')})}
  else{S.aiFail=true;toast('error','AI isn’t responding','The server may be waking up. Tap “Retry” in the chat.',5000)}
  paint()}
async function summarize(){const t=S.msgs.filter(m=>m.type==='text'&&m.text&&!m.deleted).slice(-60).map(m=>`${m.senderId===uid?'Me':nm(P(m.senderId).name)}: ${m.text}`).join('\n');
  if(t.length<30)return toast('info','Nothing to summarize','This chat has too few text messages.');
  const m=modal(`<div class="mi">✨</div><h3>Chat summary</h3><p id="sm">Reading the conversation…</p><div class="mb"><button class="b1" data-x="1">Done</button></div>`);m.box.querySelector('[data-x]').onclick=m.close;

  (arr.length?`<div class="sec">${arr.length} friend${arr.length>1?'s':''}</div>`+arr.map(p=>`<div class="item" data-f="${p.uid}">${av(p,48)}<div class="im"><div class="l1"><b>${esc(p.name)}</b></div><div class="l2"><span>@${esc(p.username||'')} · ${presence(p)}</span></div></div></div>`).join(''):empt('🫂','No friends yet','Tap “Add a friend” and enter a username to save them.'))}
$('#fq').addEventListener('input',renderFriends);
$('#fl').addEventListener('click',e=>{if(e.target.closest('[data-add]'))return addFriend();const r=e.target.closest('[data-f]');if(r)openDM(r.dataset.f)});
lp($('#fl'),e=>{const r=e.target.closest('[data-f]');if(!r)return;const u=r.dataset.f,p=P(u);
  actions(p.name,[{ico:IC.chat,label:'Message',fn:()=>openDM(u)},{ico:IC.block,label:S.blocked.includes(u)?'Unblock':'Block',danger:1,fn:()=>toggleBlock(u)},{ico:IC.trash,label:'Remove friend',danger:1,fn:()=>removeFriend(u)}])});
async function removeFriend(u){if(!await confirmBox({title:'Remove friend?',text:`${P(u).name} will be removed from your saved friends. Your chat history stays.`,ok:'Remove',danger:true,icon:'👤'}))return;
  try{await deleteDoc(doc(db,'users',uid,'friends',u));toast('success','Friend removed','',2200)}catch(e){toast('error','Couldn’t remove','Check your connection.')}}
function addFriend(){const m=modal(`<div class="grab"></div><h3 class="sh">Add a friend</h3><p class="sub">Enter their Chatora username.</p><div class="fi2"><span>@</span><input id="afu" autocapitalize="none" autocomplete="off" spellcheck="false" maxlength="20" placeholder="username"></div><button class="b1 wide" id="afgo">Search</button><div id="afres"></div>`,true);
  const inp=m.box.querySelector('#afu'),res=m.box.querySelector('#afres');setTimeout(()=>inp.focus(),300);
  const go=async()=>{const u=inp.value.trim().toLowerCase().replace(/^@/,'');if(!/^[a-z][a-z0-9_]{2,19}$/.test(u))return toast('warn','Check the username','Use 3 to 20 letters, numbers or underscores.');
    res.innerHTML='<p class="sub" style="margin-top:12px">Searching…</p>';
    try{const s=await getDoc(doc(db,'usernames',u));if(!s.exists()){res.innerHTML=`<p class="sub" style="margin-top:12px">No one found with @${esc(u)}.</p>`;return}
      const fid=s.data().uid;if(fid===uid){res.innerHTML='<p class="sub" style="margin-top:12px">That’s your own username.</p>';return}
      const p=await loadProf(fid,true),saved=!!S.friends[fid];
      res.innerHTML=`<div class="card">${av(p,56)}<div><b>${esc(p.name)}</b><small>@${esc(p.username||u)}${p.preferredLanguage?' · '+esc(p.preferredLanguage.name):''}</small></div></div><div class="two"><button class="b1" id="afs" ${saved?'disabled':''}>${saved?'Already saved':'Save friend'}</button><button class="b2" id="afm">Message</button></div>`;
      res.querySelector('#afm').onclick=()=>{m.close();openDM(fid)};
      res.querySelector('#afs').onclick=async e=>{const b=e.currentTarget;b.disabled=true;if(await saveFriend(fid)){b.textContent='Saved ✓'}else b.disabled=false}}
    catch(e){rulesErr(e,'usernames');res.innerHTML='<p class="sub" style="margin-top:12px">Couldn’t search right now. Please try again.</p>'}};
  m.box.querySelector('#afgo').onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()})}

/* new chat + group */

  const m=modal(`<div class="grab"></div><h3 class="sh">New chat</h3><div class="acts"><button class="act" data-g="1"><span>${IC.users}</span>New group</button><button class="act" data-a="1"><span>${IC.userp}</span>Add a friend</button></div>${fr.length?`<div class="sec" style="padding-left:6px">Your friends</div>`+fr.map(p=>`<div class="item" data-u="${p.uid}" style="padding:8px 4px">${av(p,44)}<div class="im"><div class="l1"><b>${esc(p.name)}</b></div><div class="l2"><span>@${esc(p.username||'')}</span></div></div></div>`).join(''):'<p class="sub" style="padding:12px 6px">Save a friend first to start chatting.</p>'}`,true);
  m.box.addEventListener('click',e=>{if(e.target.closest('[data-g]')){m.close();newGroup();return}if(e.target.closest('[data-a]')){m.close();addFriend();return}const r=e.target.closest('[data-u]');if(r){m.close();openDM(r.dataset.u)}})}
function newGroup(){const fr=Object.keys(S.friends).map(P).sort((a,b)=>nm(a.name).localeCompare(nm(b.name)));if(fr.length<2)return toast('info','Save at least 2 friends first','Groups need you plus two or more friends.',4000);
  const m=modal(`<div class="grab"></div><h3 class="sh">New group</h3><div class="fi2"><input id="gn" maxlength="40" placeholder="Group name"></div><div class="sec" style="padding-left:6px">Choose members</div>${fr.map(p=>`<label class="chk"><input type="checkbox" value="${p.uid}">${av(p,38)}<b>${esc(p.name)}</b></label>`).join('')}<button class="b1 wide" id="gc">Create group</button>`,true);

    if(name.length<2)return toast('warn','Name your group','Enter at least 2 characters.');if(sel.length<2)return toast('warn','Pick members','Choose at least 2 friends.');
    const ref=doc(collection(db,'chats')),c={type:'group',name,members:[uid,...sel],createdBy:uid,createdAt:serverTimestamp(),lastAt:serverTimestamp(),lastMessage:{text:'Group created',type:'text',senderId:uid,senderName:S.my.name||''},unread:{}};
    try{await setDoc(ref,c);m.close();toast('success','Group created',name,2600);setTab('chats');openChat({id:ref.id,type:'group',name,members:c.members})}catch(e){rulesErr(e,'chats');toast('error','Couldn’t create group','Check your connection.')}}}

/* ================= status ================= */
const alive=s=>ms(s.expiresAt)>Date.now(),BGS=['linear-gradient(135deg,#0F766E,#10B981)','linear-gradient(135deg,#0e7490,#22D3EE)','linear-gradient(135deg,#7c3aed,#c084fc)','linear-gradient(135deg,#be123c,#fb7185)','linear-gradient(135deg,#b45309,#fbbf24)','linear-gradient(135deg,#1d4ed8,#60a5fa)','linear-gradient(135deg,#111827,#374151)'];
function watchStatuses(){S.stU.forEach(f=>f());S.stU=[];const ids=[uid,...Object.keys(S.friends)];
  for(let i=0;i<ids.length;i+=10){const ch=ids.slice(i,i+10);S.stU.push(onSnapshot(query(collection(db,'statuses'),where('uid','in',ch)),s=>{ch.forEach(u=>delete S.sts[u]);
    s.forEach(d=>{const x={id:d.id,...d.data({serverTimestamps:'estimate'})};(S.sts[x.uid]??=[]).push(x)});
    if(!S.cleaned){S.cleaned=1;(S.sts[uid]||[]).filter(x=>!alive(x)&&x.expiresAt).forEach(x=>deleteDoc(doc(db,'statuses',x.id)).catch(()=>{}))}renderStatus()},e=>rulesErr(e,'statuses')))}}
const mineS=()=>(S.sts[uid]||[]).filter(alive).sort((a,b)=>ms(a.createdAt)-ms(b.createdAt));
const unseen=u=>(S.sts[u]||[]).some(s=>alive(s)&&!(s.viewers||[]).includes(uid));
function renderStatus(){const mine=mineS(),m=S.my,others=Object.keys(S.sts).filter(u=>u!==uid&&S.friends[u]&&(S.sts[u]||[]).some(alive)).sort((a,b)=>(unseen(b)-unseen(a))||(ms(S.sts[b].slice(-1)[0].createdAt)-ms(S.sts[a].slice(-1)[0].createdAt)));
  const row=(u,mi)=>{const p=P(u),l=(S.sts[u]||[]).filter(alive).sort((a,b)=>ms(a.createdAt)-ms(b.createdAt)),last=l[l.length-1];return`<div class="item" data-s="${u}"><div class="ring ${mi&&!l.length?'none':unseen(u)||mi?'':'seen'}">${av(p,50)}${mi?`<span class="plus">+</span>`:''}</div><div class="im"><div class="l1"><b>${mi?'My status':esc(p.name)}</b></div><div class="l2"><span>${l.length?(mi?l.length+' update'+(l.length>1?'s':'')+' · ':'')+ago(last.createdAt):'Tap to add a status update'}</span></div></div></div>`};
  const seen=others.filter(u=>!unseen(u)),fresh=others.filter(unseen);
  $('#sl').innerHTML=row(uid,1)+(fresh.length?'<div class="sec">Recent updates</div>'+fresh.map(u=>row(u)).join(''):'')+(seen.length?'<div class="sec">Viewed</div>'+seen.map(u=>row(u)).join(''):'')+(!others.length?empt('🌅','No updates yet','When your friends post a status, it shows up here for 24 hours.'):'');
  const n=fresh.length,b=$('#nbS');b.textContent=n;b.classList.toggle('hide',!n)}
$('#sl').addEventListener('click',e=>{const r=e.target.closest('[data-s]');if(!r)return;const u=r.dataset.s;if(u===uid&&!mineS().length)composeStatus();else openStory(u)});
function composeStatus(){let bg=0,img=null,privacy='all',excluded=[];const m=modal(`<div class="grab"></div><h3 class="sh">New status</h3><div id="sp" style="border-radius:18px;min-height:180px;display:flex;align-items:center;justify-content:center;padding:18px;background:${BGS[0]};overflow:hidden"><textarea id="st" maxlength="200" rows="4" placeholder="What’s on your mind?" style="width:100%;text-align:center;font-size:24px;font-weight:600;resize:none;color:#fff"></textarea></div><div class="colors">${BGS.map((g,i)=>`<button style="background:${g}" data-c="${i}" class="${i?'':'on'}" aria-label="Background ${i+1}"></button>`).join('')}<button class="b2" id="sph" style="margin-left:auto;padding:6px 14px">${IC.cam} Photo</button></div><div class="two"><button class="b2" id="sprivacy">Privacy: All Friends</button></div><p class="sub" id="sn">Disappears after 24 hours.</p><button class="b1 wide" id="spost">Post status</button>`,true);
  const sp=m.box.querySelector('#sp'),st=m.box.querySelector('#st'),prvBtn=m.box.querySelector('#sprivacy');
  
  prvBtn.onclick = () => {
    const frs = Object.keys(S.friends).map(P);
    const pm = modal(`<div class="grab"></div><h3 class="sh">Status Privacy</h3><div class="acts"><button class="act" data-p="all">All Friends</button><button class="act" data-p="exc">My Contacts Except...</button></div><div id="excList" class="hide" style="max-height:200px;overflow-y:auto;margin-top:10px">${frs.map(f=>`<label class="chk"><input type="checkbox" value="${f.uid}">${av(f,32)}<b>${esc(f.name)}</b></label>`).join('')}</div><button class="b1 wide hide" id="saveExc">Save</button>`, true);
    pm.box.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
       privacy = b.dataset.p;
       pm.box.querySelector('.acts').classList.add('hide');
       if(privacy==='exc') pm.box.querySelector('#excList').classList.remove('hide'), pm.box.querySelector('#saveExc').classList.remove('hide');
       else { prvBtn.textContent='Privacy: All Friends'; pm.close(); }
    });
    pm.box.querySelector('#saveExc').onclick = () => {
      excluded = [...pm.box.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);
      prvBtn.textContent='Privacy: Excluded '+excluded.length;
      pm.close();
    };
  };

  m.box.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c){bg=+c.dataset.c;m.box.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===c));if(!img)sp.style.background=BGS[bg]}});
  m.box.querySelector('#sph').onclick=()=>pickImage(async f=>{try{img=await prep(f,{max:800,q:.72,limit:300000});sp.style.background='#000';sp.innerHTML=`<img src="${img}" style="max-width:100%;max-height:260px;border-radius:12px" alt="">`;st.placeholder='';m.box.querySelector('#sn').textContent='Photo ready. Disappears after 24 hours.'}catch(e){toast('error','Couldn’t read that photo','Try a JPG or PNG.')}});
  m.box.querySelector('#spost').onclick=async e=>{const t=(m.box.querySelector('#st')||{value:''}).value.trim();if(!img&&!t)return toast('warn','Add something first','Type a message or add a photo.');const b=e.currentTarget;b.disabled=true;b.textContent='Posting…';
    try{await addDoc(collection(db,'statuses'),{uid,name:S.my.name||'',type:img?'image':'text',text:t,bg:BGS[bg],...(img?{image:img}:{}),createdAt:serverTimestamp(),expiresAt:Timestamp.fromMillis(Date.now()+864e5),viewers:[],privacy,excluded});m.close();toast('success','Status posted','Visible to your friends for 24 hours.',3000)}
    catch(x){b.disabled=false;b.textContent='Post status';rulesErr(x,'statuses');toast('error','Couldn’t post status','Check your connection.')}}}
function openStory(u,start=0){const arr=(S.sts[u]||[]).filter(alive).sort((a,b)=>ms(a.createdAt)-ms(b.createdAt));if(!arr.length)return;let i=Math.min(start,arr.length-1),el=0,paused=false,iv,dn=0;const v=$('#viewer'),own=u===uid,p=P(u);
  const close=()=>{clearInterval(iv);v.classList.remove('on');v.innerHTML=''};
  function show(){clearInterval(iv);const s=arr[i];if(!own&&!S.viewed.has(s.id)&&!(s.viewers||[]).includes(uid)){S.viewed.add(s.id);updateDoc(doc(db,'statuses',s.id),{viewers:arrayUnion(uid)}).catch(()=>{})}
    v.classList.add('on');v.innerHTML=`<div class="sp">${arr.map((_,k)=>`<i><b style="width:${k<i?100:0}%"></b></i>`).join('')}</div><div class="sh2">${av(p,38)}<div><b>${own?'My status':esc(p.name)}</b><small>${ago(s.createdAt)}</small></div>${own?`<button class="ib" id="sdel" aria-label="Delete status" style="color:#fff">${IC.trash}</button>`:''}<button class="ib" id="sx" aria-label="Close" style="color:#fff">${IC.x}</button></div>
    <div class="sbody" style="background:${s.type==='image'?'#000':esc(s.bg||BGS[0])}">${s.type==='image'?`<img src="${s.image}" alt="">${s.text?`<div class="scap">${esc(s.text)}</div>`:''}`:esc(s.text)}</div>
    ${own?`<div class="sfoot"><button id="sv" style="display:flex;gap:8px;align-items:center;color:#fff">${IC.eye}${(s.viewers||[]).length} view${(s.viewers||[]).length===1?'':'s'}</button></div>`:
    `<div class="sfoot"><input id="sreply" placeholder="Reply..." style="flex:1;background:rgba(255,255,255,.15);border-radius:20px;padding:8px 16px;color:#fff;margin-right:10px;"><button id="sreact" style="font-size:24px;margin-right:10px;">❤️</button><button id="sreshare" style="color:#fff;">${IC.send}</button></div>`}`;
    
    el=0;const bar=v.querySelectorAll('.sp b')[i],tot=s.type==='image'?6000:5000;iv=setInterval(()=>{if(paused)return;el+=50;bar.style.width=Math.min(100,el/tot*100)+'%';if(el>=tot)next()},50);
    
    if(!own){
      v.querySelector('#sreact').onclick = async () => {
        paused = true;
        const rx = prompt("React with emoji:", "❤️");
        if(rx) { await addDoc(collection(db,'chats',[uid,u].sort().join('_'),'messages'),{senderId:uid,createdAt:serverTimestamp(),type:'text',text:`Reacted ${rx} to your status`}); toast('success','Reaction sent','',2000); }
        paused = false;
      };
      v.querySelector('#sreshare').onclick = () => {
        paused = true;
        openDM(u); close(); toast('info','Resharing...','Send a message about this status',3000);
      };
      v.querySelector('#sreply').onkeypress = async (e) => {
        if(e.key==='Enter' && e.target.value.trim()) {
          paused = true;
          await addDoc(collection(db,'chats',[uid,u].sort().join('_'),'messages'),{senderId:uid,createdAt:serverTimestamp(),type:'text',text:`Replied to your status: ${e.target.value.trim()}`});
          toast('success','Reply sent','',2000); paused=false;
        }
      };
    }
  }
  const next=()=>{i<arr.length-1?(i++,show()):close()},prev=()=>{i>0?(i--,show()):show()};
  v.onpointerdown=e=>{if(e.target.closest('button')||e.target.closest('input'))return;paused=true;dn=Date.now()};
  v.onpointerup=e=>{if(e.target.closest('button')||e.target.closest('input'))return;paused=false;if(Date.now()-dn<260){e.clientX<innerWidth/3?prev():next()}};v.onpointercancel=()=>{paused=false};
  v.onclick=async e=>{if(e.target.closest('#sx')){close()}
    else if(e.target.closest('#sdel')){paused=true;if(await confirmBox({title:'Delete this status?',text:'It will be removed for everyone.',ok:'Delete',danger:true,icon:'🗑️'})){try{await deleteDoc(doc(db,'statuses',arr[i].id));toast('success','Status deleted','',2200);arr.splice(i,1);if(!arr.length)close();else{i=Math.min(i,arr.length-1);paused=false;show()}}catch(x){paused=false;toast('error','Couldn’t delete','Check your connection.')}}else paused=false}
    else if(e.target.closest('#sv')){paused=true;const vs=arr[i].viewers||[];await Promise.all(vs.map(x=>loadProf(x)));const m=modal(`<div class="grab"></div><h3 class="sh">Viewed by ${vs.length}</h3>${vs.length?vs.map(x=>`<div class="lrow" style="border:0;padding:8px 4px">${av(P(x),40)}<span>${esc(P(x).name)}</span></div>`).join(''):'<p class="sub">No views yet.</p>'}`,true);const o=m.close;m.el.addEventListener('click',()=>{setTimeout(()=>{paused=false},300)})}};
  show()}

    mm.box.addEventListener('click',e=>{const b=e.target.closest('[data-u]');if(b){mm.close();toggleBlock(b.dataset.u)}})};
  $('#mlo').onclick=async()=>{if(await confirmBox({title:'Log out?',text:'You’ll need to sign in again to read your messages.',ok:'Log out',icon:'👋'})){await ping(false);toast('info','Logging out…','',1500);logout('login')}}}
