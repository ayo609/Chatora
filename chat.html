<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chatora — Messages</title>
<link rel="icon" type="image/png" href="chatora-logo.png" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#04070a; --teal:#0F766E; --emerald:#10B981; --cyan:#22D3EE; --text:#e6edf3; --muted:#7b8894; }
  * { font-family: 'Inter', sans-serif; box-sizing: border-box; margin:0; padding:0; }
  h1,h2,h3,h4,.brand { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em; }
  body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  /* Layout */
  .app-container { display: flex; flex: 1; overflow: hidden; height: 100vh; }
  
  /* Sidebar */
  .sidebar { width: 340px; background: rgba(10,18,25,0.6); border-right: 1px solid rgba(34,211,238,0.08); display: flex; flex-direction: column; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid rgba(34,211,238,0.08); display: flex; justify-content: space-between; align-items: center; }
  .search-box { margin: 12px 16px; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(34,211,238,0.15); border-radius: 10px; color: white; outline: none; font-size: 13px; width: calc(100% - 32px); }
  
  .chat-list { flex: 1; overflow-y: auto; }
  .chat-item { display: flex; gap: 12px; padding: 14px 16px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid rgba(255,255,255,0.02); }
  .chat-item:hover, .chat-item.active { background: rgba(34,211,238,0.06); }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #0F766E, #10B981); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; position: relative; }
  .online-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background: #10B981; border: 2px solid #04070a; border-radius: 50%; }
  
  .chat-info { flex: 1; overflow: hidden; }
  .chat-name { font-weight: 500; font-size: 14.5px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  .chat-preview { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; }

  /* Main Chat Area */
  .main-chat { flex: 1; display: flex; flex-direction: column; background: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="%2304070a"/><circle cx="50" cy="50" r="1" fill="%2322D3EE" opacity="0.05"/></svg>'); }
  .chat-header { padding: 14px 24px; border-bottom: 1px solid rgba(34,211,238,0.08); display: flex; justify-content: space-between; align-items: center; background: rgba(10,18,25,0.4); backdrop-filter: blur(10px); z-index: 10; }
  
  .messages-area { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .msg-row { display: flex; gap: 10px; max-width: 75%; }
  .msg-row.out { margin-left: auto; flex-direction: row-reverse; }
  .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; position: relative; word-wrap: break-word; }
  .msg-row.in .msg-bubble { background: rgba(20,30,40,0.95); border: 1px solid rgba(34,211,238,0.1); border-bottom-left-radius: 4px; }
  .msg-row.out .msg-bubble { background: linear-gradient(135deg, #0F766E, #10B981); color: white; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px -5px rgba(16,185,129,0.4); }
  .msg-meta { font-size: 10px; margin-top: 4px; display: flex; justify-content: flex-end; gap: 4px; opacity: 0.7; }
  
  /* Voice Note UI */
  .voice-msg { display: flex; align-items: center; gap: 10px; min-width: 200px; }
  .play-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .voice-wave { display: flex; align-items: center; gap: 2px; height: 20px; flex: 1; }
  .voice-wave span { width: 3px; background: currentColor; border-radius: 2px; opacity: 0.5; }
  .msg-row.out .voice-wave span { background: #fff; opacity: 0.8; }
  .delete-btn { cursor: pointer; opacity: 0; transition: opacity 0.2s; color: #ef4444; margin-left: 8px; font-size: 11px; font-weight: bold; }
  .msg-row:hover .delete-btn { opacity: 1; }

  /* Input Area */
  .input-area { padding: 16px 24px; background: rgba(10,18,25,0.8); border-top: 1px solid rgba(34,211,238,0.08); display: flex; gap: 12px; align-items: center; }
  .input-box { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(34,211,238,0.15); border-radius: 12px; padding: 12px 16px; color: white; outline: none; font-size: 14px; transition: border 0.3s; }
  .input-box:focus { border-color: var(--cyan); }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--cyan); background: rgba(34,211,238,0.08); transition: all 0.2s; }
  .icon-btn.recording { background: #ef4444; color: white; animation: pulse 1s infinite; }
  .send-btn { background: linear-gradient(135deg, #0F766E, #10B981); color: white; padding: 0 20px; border-radius: 12px; font-weight: 500; cursor: pointer; height: 40px; border: none; }
  
  /* Toasts */
  .toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
  .toast { background: rgba(10,18,25,0.95); border: 1px solid var(--cyan); border-radius: 12px; padding: 12px 16px; color: white; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: slideIn 0.3s ease; }
  
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 70% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  @media (max-width: 768px) {
    .sidebar { width: 100%; position: absolute; z-index: 20; height: 100%; transition: transform 0.3s; }
    .sidebar.hidden { transform: translateX(-100%); }
    .main-chat { width: 100%; }
    .msg-row { max-width: 90%; }
  }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='profile.html'">
        <div class="avatar" style="width:36px; height:36px; font-size:14px;" id="my-avatar">...</div>
        <div>
          <div class="font-semibold text-sm" id="my-name">Loading...</div>
          <div class="text-[10px] text-emerald-400">Online</div>
        </div>
      </div>
      <div style="cursor:pointer; color:var(--muted);" onclick="window.location.href='settings.html'">
        ⚙️
      </div>
    </div>
    
    <input type="text" class="search-box" placeholder="Search users by email...">
    
    <div class="chat-list" id="chat-list-container">
      <!-- Real chats will load here -->
    </div>
  </div>

  <!-- MAIN CHAT -->
  <div class="main-chat">
    <div class="chat-header" id="chat-header-area">
      <div class="flex items-center gap-3">
        <button class="md:hidden" onclick="document.getElementById('sidebar').classList.toggle('hidden')" style="background:none; border:none; color:white; margin-right:8px;">☰</button>
        <div class="avatar" id="header-avatar">?</div>
        <div>
          <div class="font-semibold text-[15px]" id="header-name">Select a chat</div>
          <div class="text-[11px] text-emerald-400" id="header-status">...</div>
        </div>
      </div>
    </div>

    <div class="messages-area" id="messages-area">
      <!-- Real messages load here -->
    </div>

    <div class="input-area">
      <input type="text" class="input-box" id="message-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
      <div class="icon-btn" id="mic-btn" onclick="toggleRecord()">🎙️</div>
      <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, query, where, orderBy, onSnapshot, addDoc, serverTimestamp, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  // YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyDLVQaV9gmlNFDkQLtTytl71F_aJk15xXg",
    authDomain: "chatora-c309f.firebaseapp.com",
    projectId: "chatora-c309f",
    storageBucket: "chatora-c309f.firebasestorage.app",
    messagingSenderId: "619677340839",
    appId: "1:619677340839:web:795c3fd79d87c8d05db782"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  let currentUser = null;
  let activeChatId = null;
  let unsubscribeMessages = null;
  let isRecording = false;
  let mediaRecorder;
  let audioChunks = [];

  // 1. AUTH GUARD (Kick out if not logged in)
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('my-name').innerText = user.email.split('@')[0];
      document.getElementById('my-avatar').innerText = user.email[0].toUpperCase();
      loadRealChats();
    } else {
      window.location.href = 'login.html'; // CHANGE THIS if your login page has a different name
    }
  });

  // 2. LOAD REAL CHATS (Just the AI for now, until you add friends)
  function loadRealChats() {
    const list = document.getElementById('chat-list-container');
    list.innerHTML = `
      <div class="chat-item" onclick="openChat('ai', 'Chatora AI', '✨')">
        <div class="avatar" style="background: linear-gradient(135deg, #22D3EE, #0F766E);">✨</div>
        <div class="chat-info">
          <div class="chat-name">Chatora AI</div>
          <div class="chat-preview">How can I help you today?</div>
        </div>
      </div>
    `;
    // Note: To load real users, you would query the 'users' collection here.
  }

  // 3. OPEN CHAT & LISTEN FOR REAL MESSAGES
  window.openChat = (chatId, name, initial) => {
    activeChatId = chatId;
    document.getElementById('header-name').innerText = name;
    document.getElementById('header-avatar').innerText = initial;
    document.getElementById('header-status').innerText = chatId === 'ai' ? 'AI Assistant' : 'Online';
    
    if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('hidden');

    // Detach old listener
    if (unsubscribeMessages) unsubscribeMessages();

    const messagesArea = document.getElementById('messages-area');
    messagesArea.innerHTML = '<div class="text-center text-gray-500 mt-10">Loading messages...</div>';

    // Real-time Firestore Listener
    const q = query(
      collection(db, "messages"),
      where("chatId", "==", chatId),
      orderBy("createdAt", "asc")
    );

    unsubscribeMessages = onSnapshot(q, (snapshot) => {
      messagesArea.innerHTML = '';
      if (snapshot.empty) {
        messagesArea.innerHTML = '<div class="text-center text-gray-500 mt-10 text-sm">No messages yet. Say hi!</div>';
      }
      snapshot.forEach((docSnap) => {
        const msg = docSnap.data();
        const msgId = docSnap.id;
        const isMe = msg.senderId === currentUser.uid;
        
        const row = document.createElement('div');
        row.className = `msg-row ${isMe ? 'out' : 'in'}`;
        
        let content = '';
        if (msg.type === 'voice') {
          content = `
            <div class="voice-msg">
              <div class="play-btn" onclick="new Audio('${msg.audioUrl}').play()">▶</div>
              <div class="voice-wave">
                <span style="height:40%"></span><span style="height:80%"></span><span style="height:60%"></span><span style="height:100%"></span><span style="height:50%"></span><span style="height:70%"></span><span style="height:30%"></span><span style="height:90%"></span>
              </div>
              <span style="font-size:11px;">Voice</span>
            </div>
          `;
        } else {
          content = `<div>${msg.text}</div>`;
        }

        const deleteBtn = isMe ? `<span class="delete-btn" onclick="deleteMsg('${msgId}', '${msg.audioPath || ''}')">🗑️</span>` : '';
        const time = msg.createdAt ? new Date(msg.createdAt.toMillis()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...';

        row.innerHTML = `
          <div class="msg-bubble">
            ${content}
            <div class="msg-meta">
              <span>${time}</span>
              ${isMe ? '<span style="color:#67e8f9;">✓✓</span>' : ''}
              ${deleteBtn}
            </div>
          </div>
        `;
        messagesArea.appendChild(row);
      });
      messagesArea.scrollTop = messagesArea.scrollHeight;
    });
  };

  // 4. SEND REAL MESSAGE
  window.sendMessage = async () => {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!text || !activeChatId) return;
    input.value = '';

    await addDoc(collection(db, "messages"), {
      chatId: activeChatId,
      text: text,
      senderId: currentUser.uid,
      type: 'text',
      createdAt: serverTimestamp()
    });

    // AI Integration (Simulated until Render proxy is connected)
    if (activeChatId === 'ai') {
      setTimeout(async () => {
        await addDoc(collection(db, "messages"), {
          chatId: 'ai',
          text: "I am currently in UI mode. Connect the proxy to get real answers.",
          senderId: 'AI_BOT',
          type: 'text',
          createdAt: serverTimestamp()
        });
      }, 1000);
    }
  };

  window.handleEnter = (e) => { if (e.key === 'Enter') sendMessage(); };

  // 5. REAL VOICE RECORDING & STORAGE UPLOAD
  window.toggleRecord = async () => {
    const btn = document.getElementById('mic-btn');
    if (!activeChatId) return showToast("Select a chat first!");

    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        
        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const fileName = `voice_${Date.now()}.webm`;
          const storageRef = ref(storage, `voice_notes/${fileName}`);

          showToast("Uploading voice note...");
          
          try {
            // 1. Upload to Firebase Storage
            await uploadBytes(storageRef, audioBlob);
            const downloadURL = await getDownloadURL(storageRef);

            // 2. Save message to Firestore
            await addDoc(collection(db, "messages"), {
              chatId: activeChatId,
              type: 'voice',
              audioUrl: downloadURL,
              audioPath: storageRef.fullPath,
              senderId: currentUser.uid,
              createdAt: serverTimestamp()
            });
            showToast("🎙️ Voice note sent!");
          } catch (error) {
            showToast("Error uploading audio.");
          }
          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();
        isRecording = true;
        btn.classList.add('recording');
        btn.innerHTML = '⏹';
      } catch (err) {
        showToast("Microphone access denied.");
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      btn.classList.remove('recording');
      btn.innerHTML = '🎙️';
    }
  };

  // 6. DELETE MESSAGE & AUDIO FILE
  window.deleteMsg = async (msgId, audioPath) => {
    if (!confirm("Delete this message?")) return;
    try {
      // Delete from Firestore
      await deleteDoc(doc(db, "messages", msgId));
      
      // Delete from Storage if it's a voice note
      if (audioPath) {
        const fileRef = ref(storage, audioPath);
        await deleteObject(fileRef);
      }
      showToast("🗑️ Message deleted");
    } catch (e) {
      showToast("Failed to delete.");
    }
  };

  function showToast(msg) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = msg;
    container.appendChild(toast);
    setTimeout(() => { toast.remove(); }, 3000);
  }

</script>
</body>
</html>
