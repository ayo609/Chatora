<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chatora — Messages</title>
<link rel="icon" type="image/png" href="chatora-logo.png" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#04070a; --teal:#0F766E; --emerald:#10B981; --cyan:#22D3EE; --text:#e6edf3; --muted:#7b8894; }
  * { font-family: 'Inter', sans-serif; box-sizing: border-box; margin:0; padding:0; }
  h1,h2,h3,h4,.brand { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em; }
  body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  /* Top bar */
  .top-bar { background: rgba(4,7,10,0.8); border-bottom: 1px solid rgba(34,211,238,0.1); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #67e8f9; }
  
  /* Layout */
  .app-container { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 40px); }
  
  /* Sidebar */
  .sidebar { width: 340px; background: rgba(10,18,25,0.6); border-right: 1px solid rgba(34,211,238,0.08); display: flex; flex-direction: column; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid rgba(34,211,238,0.08); display: flex; justify-content: space-between; align-items: center; }
  .search-box { margin: 12px 16px; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(34,211,238,0.15); border-radius: 10px; color: white; outline: none; font-size: 13px; width: calc(100% - 32px); }
  .search-box:focus { border-color: var(--cyan); }
  
  .chat-list { flex: 1; overflow-y: auto; }
  .chat-item { display: flex; gap: 12px; padding: 14px 16px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid rgba(255,255,255,0.02); }
  .chat-item:hover, .chat-item.active { background: rgba(34,211,238,0.06); }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #0F766E, #10B981); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; position: relative; }
  .online-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background: #10B981; border: 2px solid #04070a; border-radius: 50%; }
  
  .chat-info { flex: 1; overflow: hidden; }
  .chat-name { font-weight: 500; font-size: 14.5px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  .chat-preview { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; }
  .unread-badge { background: var(--emerald); color: #000; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; }

  /* Main Chat Area */
  .main-chat { flex: 1; display: flex; flex-direction: column; background: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="%2304070a"/><circle cx="50" cy="50" r="1" fill="%2322D3EE" opacity="0.05"/></svg>'); }
  .chat-header { padding: 14px 24px; border-bottom: 1px solid rgba(34,211,238,0.08); display: flex; justify-content: space-between; align-items: center; background: rgba(10,18,25,0.4); backdrop-filter: blur(10px); z-index: 10; }
  
  .messages-area { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .msg-row { display: flex; gap: 10px; max-width: 75%; }
  .msg-row.out { margin-left: auto; flex-direction: row-reverse; }
  .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; position: relative; word-wrap: break-word; }
  .msg-row.in .msg-bubble { background: rgba(20,30,40,0.95); border: 1px solid rgba(34,211,238,0.1); border-bottom-left-radius: 4px; }
  .msg-row.out .msg-bubble { background: linear-gradient(135deg, #0F766E, #10B981); color: white; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px -5px rgba(16,185,129,0.4); }
  .msg-meta { font-size: 10px; margin-top: 4px; display: flex; justify-content: flex-end; gap: 4px; opacity: 0.7; }
  .msg-row.in .msg-meta { color: var(--muted); }
  
  /* Voice Note UI inside chat */
  .voice-msg { display: flex; align-items: center; gap: 10px; min-width: 200px; }
  .play-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .voice-wave { display: flex; align-items: center; gap: 2px; height: 20px; flex: 1; }
  .voice-wave span { width: 3px; background: currentColor; border-radius: 2px; opacity: 0.5; }
  .msg-row.out .voice-wave span { background: #fff; opacity: 0.8; }
  .delete-btn { cursor: pointer; opacity: 0; transition: opacity 0.2s; color: #ef4444; margin-left: 8px; font-size: 12px; }
  .msg-row:hover .delete-btn { opacity: 1; }

  /* Input Area */
  .input-area { padding: 16px 24px; background: rgba(10,18,25,0.8); border-top: 1px solid rgba(34,211,238,0.08); display: flex; gap: 12px; align-items: center; }
  .input-box { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(34,211,238,0.15); border-radius: 12px; padding: 12px 16px; color: white; outline: none; font-size: 14px; transition: border 0.3s; }
  .input-box:focus { border-color: var(--cyan); }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--cyan); background: rgba(34,211,238,0.08); transition: all 0.2s; }
  .icon-btn:hover { background: rgba(34,211,238,0.15); }
  .icon-btn.recording { background: #ef4444; color: white; animation: pulse 1s infinite; }
  .send-btn { background: linear-gradient(135deg, #0F766E, #10B981); color: white; padding: 0 20px; border-radius: 12px; font-weight: 500; cursor: pointer; height: 40px; border: none; display: flex; align-items: center; gap: 8px; }
  
  /* Notifications Toast */
  .toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
  .toast { background: rgba(10,18,25,0.95); border: 1px solid var(--cyan); border-radius: 12px; padding: 12px 16px; color: white; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 10px; }
  
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 70% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* Mobile */
  @media (max-width: 768px) {
    .sidebar { width: 100%; position: absolute; z-index: 20; height: 100%; transition: transform 0.3s; }
    .sidebar.hidden { transform: translateX(-100%); }
    .main-chat { width: 100%; }
    .msg-row { max-width: 90%; }
  }
</style>
</head>
<body>

<!-- Temporary Testing Bar (Will be removed when login.html is built) -->
<div class="top-bar">
  <span>⚡ Testing Mode: Chat runs on Local Storage. AI chat UI is ready.</span>
  <button onclick="window.location.href='index.html'" style="background:transparent; border:1px solid #67e8f9; color:#67e8f9; padding:2px 8px; border-radius:4px; cursor:pointer;">Exit</button>
</div>

<div class="app-container">
  
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="flex items-center gap-3">
        <div class="avatar" style="width:36px; height:36px; font-size:14px;">Me</div>
        <div>
          <div class="font-semibold text-sm">My Account</div>
          <div class="text-[10px] text-emerald-400">Online</div>
        </div>
      </div>
      <div style="cursor:pointer; color:var(--muted);" onclick="window.location.href='settings.html'">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </div>
    </div>
    
    <input type="text" class="search-box" placeholder="Search users or chats...">
    
    <div class="chat-list">
      <!-- AI Chat -->
      <div class="chat-item" onclick="switchChat('ai')" id="chat-ai">
        <div class="avatar" style="background: linear-gradient(135deg, #22D3EE, #0F766E);">✨</div>
        <div class="chat-info">
          <div class="chat-name">Chatora AI <span style="font-size:10px; background:rgba(34,211,238,0.2); padding:2px 6px; border-radius:4px; color:#67e8f9;">AI</span></div>
          <div class="chat-preview">How can I help you today?</div>
        </div>
      </div>
      
      <!-- Contact -->
      <div class="chat-item active" onclick="switchChat('ada')" id="chat-ada">
        <div class="avatar">A <div class="online-dot"></div></div>
        <div class="chat-info">
          <div class="chat-name">Ada Nwosu <span class="text-[10px] text-gray-500">10:42 AM</span></div>
          <div class="chat-preview"><span>Just sent the voice note</span> <span class="unread-badge">2</span></div>
        </div>
      </div>
      
      <!-- Contact -->
      <div class="chat-item" onclick="switchChat('tunde')" id="chat-tunde">
        <div class="avatar">T</div>
        <div class="chat-info">
          <div class="chat-name">Tunde <span class="text-[10px] text-gray-500">Yesterday</span></div>
          <div class="chat-preview">See you tomorrow</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN CHAT -->
  <div class="main-chat">
    <div class="chat-header">
      <div class="flex items-center gap-3">
        <button class="md:hidden" onclick="document.getElementById('sidebar').classList.toggle('hidden')" style="background:none; border:none; color:white; margin-right:8px; cursor:pointer;">☰</button>
        <div class="avatar" id="header-avatar">A</div>
        <div>
          <div class="font-semibold text-[15px]" id="header-name">Ada Nwosu</div>
          <div class="text-[11px] text-emerald-400" id="header-status">Online</div>
        </div>
      </div>
    </div>

    <div class="messages-area" id="messages-area">
      <!-- Messages will load here via JS -->
    </div>

    <!-- Typing indicator -->
    <div id="typing-indicator" style="padding: 0 24px 10px; font-size:12px; color:var(--muted); display:none;">
      <span class="animate-pulse">Someone is typing...</span>
    </div>

    <div class="input-area">
      <div class="icon-btn" onclick="alert('File upload UI ready')">📎</div>
      <input type="text" class="input-box" id="message-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
      <div class="icon-btn" id="mic-btn" onclick="toggleRecord()">🎙️</div>
      <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script type="module">
  // ==========================================
  // 1. TEMPORARY LOCAL STORAGE (For UI Testing)
  // ==========================================
  let currentChat = 'ada';
  let isRecording = false;
  let mediaRecorder;
  let audioChunks = [];

  // Mock Data for UI
  const chats = {
    ada: [
      { id: 1, text: "Hey! Did you get the notes?", sender: 'in', time: '10:40 AM' },
      { id: 2, text: "Yes, thank you so much!", sender: 'out', time: '10:41 AM' },
      { id: 3, text: "Just sent the voice note", sender: 'in', time: '10:42 AM', type: 'voice', duration: '0:14' }
    ],
    tunde: [
      { id: 4, text: "See you tomorrow", sender: 'in', time: 'Yesterday' }
    ],
    ai: [
      { id: 5, text: "Hello! I am Chatora AI. I can summarize chats, translate text, or answer any question. How can I help?", sender: 'in', time: 'Now' }
    ]
  };

  function loadChat(chatId) {
    currentChat = chatId;
    document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
    document.getElementById(`chat-${chatId}`).classList.add('active');
    
    // Update Header
    const names = { ada: 'Ada Nwosu', tunde: 'Tunde', ai: 'Chatora AI ✨' };
    const avatars = { ada: 'A', tunde: 'T', ai: '✨' };
    document.getElementById('header-name').innerText = names[chatId];
    document.getElementById('header-avatar').innerText = avatars[chatId];
    document.getElementById('header-status').innerText = chatId === 'ai' ? 'AI Assistant' : 'Online';
    document.getElementById('header-avatar').style.background = chatId === 'ai' ? 'linear-gradient(135deg, #22D3EE, #0F766E)' : 'linear-gradient(135deg, #0F766E, #10B981)';
    
    // Hide sidebar on mobile
    if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('hidden');

    renderMessages();
  }

  function renderMessages() {
    const area = document.getElementById('messages-area');
    area.innerHTML = '';
    
    chats[currentChat].forEach(msg => {
      const row = document.createElement('div');
      row.className = `msg-row ${msg.sender}`;
      
      let content = '';
      if (msg.type === 'voice') {
        content = `
          <div class="voice-msg">
            <div class="play-btn">▶</div>
            <div class="voice-wave">
              <span style="height:40%"></span><span style="height:80%"></span><span style="height:60%"></span><span style="height:100%"></span><span style="height:50%"></span><span style="height:70%"></span><span style="height:30%"></span><span style="height:90%"></span>
            </div>
            <span style="font-size:11px;">${msg.duration}</span>
          </div>
        `;
      } else {
        content = `<div>${msg.text}</div>`;
      }

      const deleteBtn = `<span class="delete-btn" onclick="deleteMessage(${msg.id})">🗑️ Delete</span>`;

      row.innerHTML = `
        <div class="msg-bubble">
          ${content}
          <div class="msg-meta">
            <span>${msg.time}</span>
            ${msg.sender === 'out' ? '<span style="color:#67e8f9;">✓✓</span>' : ''}
            ${msg.sender === 'out' ? deleteBtn : ''}
          </div>
        </div>
      `;
      area.appendChild(row);
    });
    
    area.scrollTop = area.scrollHeight;
  }

  window.switchChat = loadChat;

  window.deleteMessage = (id) => {
    // In a real app, this deletes from Firebase Storage + Firestore
    chats[currentChat] = chats[currentChat].filter(m => m.id !== id);
    renderMessages();
    showToast("🗑️ Voice note deleted");
  };

  // ==========================================
  // 2. SENDING MESSAGES
  // ==========================================
  window.handleEnter = (e) => {
    if (e.key === 'Enter') sendMessage();
  };

  window.sendMessage = () => {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!text) return;

    // Add to UI
    const newMsg = { id: Date.now(), text: text, sender: 'out', time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
    chats[currentChat].push(newMsg);
    input.value = '';
    renderMessages();

    // If sending to AI, simulate thinking (until Render proxy is connected)
    if (currentChat === 'ai') {
      document.getElementById('typing-indicator').style.display = 'block';
      setTimeout(() => {
        document.getElementById('typing-indicator').style.display = 'none';
        chats['ai'].push({ 
          id: Date.now(), 
          text: "I am currently running in UI mode. Connect the AI proxy on Render to get real answers!", 
          sender: 'in', 
          time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
        });
        renderMessages();
      }, 1500);
    }
  };

  // ==========================================
  // 3. VOICE RECORDING LOGIC
  // ==========================================
  window.toggleRecord = async () => {
    const btn = document.getElementById('mic-btn');
    
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        
        mediaRecorder.onstop = () => {
          // In a real app, this is where you upload the Blob to Firebase Storage
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          
          // Add voice message to UI
          chats[currentChat].push({
            id: Date.now(),
            type: 'voice',
            sender: 'out',
            duration: '0:05', // Mock duration
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
          });
          renderMessages();
          showToast("🎙️ Voice note sent!");
          
          // Stop all tracks to release mic
          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();
        isRecording = true;
        btn.classList.add('recording');
        btn.innerHTML = '⏹';
        showToast("🔴 Recording... Tap mic to stop.");
        
      } catch (err) {
        alert("Microphone access denied. Please allow microphone permissions.");
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      btn.classList.remove('recording');
      btn.innerHTML = '🎙️';
    }
  };

  // ==========================================
  // 4. NOTIFICATIONS & TOASTS
  // ==========================================
  function showToast(message) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<span>${message}</span>`;
    container.appendChild(toast);
    
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(100%)';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  // Request browser notification permission
  if ("Notification" in window) {
    Notification.requestPermission();
  }

  // ==========================================
  // 5. INITIALIZATION
  // ==========================================
  loadChat('ada');

</script>
</body>
</html>
